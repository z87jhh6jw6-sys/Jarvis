# Déploie l'app sur GitHub Pages à chaque push sur main.
# Site 100% statique : aucun build, on publie le dossier tel quel.
# Les données de l'utilisateur ne passent JAMAIS par ce dépôt —
# elles vivent dans jarvis-data.json (iCloud Drive) ou IndexedDB.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
